# En-têtes de sécurité (CdC technique § 5.6, ENF-11). Inclus dans CHAQUE bloc location : nginx
# n'hérite pas des add_header du niveau supérieur dès qu'un bloc en déclare un.
# CSP : aucune source externe ; pas de script ni de style en ligne. blob: et data: pour les
# exports d'image (EF-M7-03). HSTS : Cloud Run termine le TLS mais n'ajoute pas l'en-tête ; il est
# ignoré par les navigateurs en HTTP (développement local), utile en production (Mozilla Observatory).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
