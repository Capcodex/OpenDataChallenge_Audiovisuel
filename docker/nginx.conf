# Configuration nginx de l'image « site » (CdC technique § 5.6). Remplace la configuration par
# défaut de l'image nginx-unprivileged : utilisateur non root, port 8080, système de fichiers en
# lecture seule (seuls /tmp et /var/cache/nginx sont inscriptibles, en tmpfs).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Fichiers temporaires dans /tmp (tmpfs).
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Journal d'accès sans adresse IP complète (CdC technique § 14) : dernier octet IPv4 masqué,
  # IPv6 réduite à son préfixe /48.
  map $remote_addr $ip_anonyme {
    ~^(?<p>\d+\.\d+\.\d+)\.\d+$ $p.0;
    ~^(?<p>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*): $p::;
    default 0.0.0.0;
  }
  log_format anonyme '$ip_anonyme [$time_local] "$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent"';
  access_log /dev/stdout anonyme;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;
  charset utf-8;
  charset_types application/json text/css application/javascript text/plain image/svg+xml;

  # Fichiers pré-compressés au build (.gz), compression à la volée en repli.
  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_types application/json text/css application/javascript image/svg+xml text/plain;

  types {
    application/geo+json geojson;
    text/csv csv;
    text/markdown md;
    application/gexf+xml gexf;
    application/vnd.apache.parquet parquet;
  }

  server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    error_page 404 /404.html;

    # Fichiers à empreinte produits par Vite : cache long.
    location /assets/ {
      include /etc/nginx/entetes.conf;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # Données et téléchargements : cache court, revalidation.
    location ~ ^/(data|telechargements)/ {
      include /etc/nginx/entetes.conf;
      add_header Cache-Control "public, max-age=300, must-revalidate";
      try_files $uri =404;
    }

    # Pages retirées : redirection permanente, les liens déjà partagés restent valables.
    # V2 : le module JT n'est plus affiché (données conservées dans graph.json).
    location ~ ^/jt/?$ {
      include /etc/nginx/entetes.conf;
      return 301 /;
    }

    location = /404.html {
      include /etc/nginx/entetes.conf;
      add_header Cache-Control "no-cache";
      internal;
    }

    # Fiche d'un média : page pré-générée si elle existe (S6), sinon l'application, qui lit
    # l'identifiant dans l'URL (lien permanent, EF-M7-01).
    location ~ ^/media/[a-z0-9-]+/?$ {
      include /etc/nginx/entetes.conf;
      add_header Cache-Control "no-cache";
      try_files $uri/index.html /index.html;
    }

    location / {
      include /etc/nginx/entetes.conf;
      add_header Cache-Control "no-cache";
      try_files $uri $uri/index.html =404;
    }
  }
}
