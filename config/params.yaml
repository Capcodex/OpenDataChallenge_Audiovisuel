# Paramètres du pipeline (RG-08). Tous les seuils sont publiés dans la page « Méthode »
# (source : docs/methode.md). Chargés et validés par pipeline/config.py : un paramètre absent,
# inconnu ou hors plage fait échouer le pipeline.

edition: "2026"
seed: 20261008

# Publication : date de traitement affichée dans la mention de source (RG-24) et les exports.
# Fixée ici, et non lue sur l'horloge, pour que deux exécutions donnent des fichiers identiques
# (ENF-12). À mettre à jour à chaque nouvelle publication des données.
publication:
  date_traitement: "2026-10-08"
  adresse_site: "https://graphe-medias.fr"   # provisoire (plateforme d'hébergement : S5)

seuils:
  media_affichable_min: 50         # RG-01 : répondants (non pondérés) qui suivent le média
  chiffre_fragile_sous: 100        # RG-03
  lien_effectif_commun_min: 30     # RG-04 : répondants (non pondérés) qui suivent les deux médias
  lien_lift_borne_basse_min: 1.0   # RG-05 : borne basse de l'intervalle strictement supérieure
  confiance_effectif_min: 50       # RG-14 : réponses de confiance pour publier l'indicateur (ADR-006)
  ecart_effectif_min_par_bord: 30  # écart gauche/droite : réponses minimales de chaque côté (ADR-006)

bootstrap:
  iterations: 1000
  niveau_confiance: 0.95

attributs:
  # Âge connu par classes seulement (RS2C_RECODE_AGE) : l'âge moyen est approché par le centre de
  # chaque classe. La classe « 65 ans et plus » n'a pas de borne haute : valeur conventionnelle
  # (ADR-006).
  age_valeur_65_plus: 74.0
  # Positionnement politique (échelle 0-10) : bornes des « bords » pour l'écart de confiance.
  gauche_max: 4                    # 0 à 4
  droite_min: 6                    # 6 à 10

# Liens affichés sur la carte (ADR-005, option C) : les données gardent tous les liens retenus
# (RG-04, RG-05) ; la carte montre, pour chaque média, ses liens les plus forts et tous les liens
# dont la borne basse dépasse le lift de référence dû à l'intensité de consommation.
affichage:
  voisins_min_par_media: 5

# Familles (ADR-007) : calculées sur les liens affichés ; sur tous les liens retenus, aucune
# partition en familles de taille utile ne respecte RG-07 (docs/exploration/familles.md).
communautes:
  algorithme: leiden
  liens: affiches                  # affiches ou retenus
  poids: log_lift                  # log_lift ou lift
  resolution: 0.6
  sous_echantillons: 100
  stabilite_noeud_min: 0.80        # RG-07
  part_noeuds_stables_min: 0.80    # RG-07
  ponts_nombre: 10                 # médias « ponts » : les N premiers par coefficient de participation

layout:
  algorithme: forceatlas2
  iterations: 2000
