      8: sud-radio
      10: ici
      11: france-inter
      12: franceinfo-radio
      13: france-culture
      14: rfi
      15: radio-locale
      16: autre-radio
      17: cherie-fm
      18: europe-2
      19: france-musique
      20: fun-radio
      21: nostalgie
      22: nrj
      23: rfm
      24: rtl2
      25: skyrock

  - variable: SOURCES1BR_B2_R2_R      # Journaux
