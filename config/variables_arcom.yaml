# Correspondance entre les questions du baromètre Arcom 2026 et le référentiel des médias
# (E0-01, E0-03, CdC technique § 6.3).
#
# Principe : seuls les codes listés sous « medias » deviennent des médias. Tous les autres codes
# (sous-totaux « ST … », « Rien de tout cela », « Non concerné », « Youtube », « Bouche à oreilles »,
# « Nombre Moyen »…) sont ignorés (RG-12). Pour chaque code listé, le pipeline vérifie que le
# libellé du dictionnaire correspond bien au média (colonne « libelles_arcom » de medias.csv) :
# une nouvelle édition qui renumérote les codes fait donc échouer le pipeline au lieu de produire
# des résultats faux.

edition: "2026"

sources:
  base: arcom_2026_base
  dictionnaire: arcom_2026_dictionnaire

colonnes:
  identifiant: RECORD2025
  poids: POIDS            # le guide parle de « POIDS03 » ; la colonne s'appelle « POIDS » en 2026

# Répondants interrogés sur les médias : personnes intéressées par l'information générale
# (87 % de l'échantillon selon le guide de l'Arcom). Un répondant est dans la base s'il a au
# moins une réponse à cette question.
question_base: SOURCES1AR_B1_R2_R

questions:

  - variable: SOURCES1AR_B1_R2_R      # Radio : marques consultées régulièrement
