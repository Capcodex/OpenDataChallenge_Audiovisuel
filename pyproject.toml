[project]
name = "graphe-medias"
version = "2.0.0"
description = "Pipeline de données du graphe de proximité des médias français"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=2.0,<3",
    "pyarrow>=17",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "pandera>=0.20",
    "duckdb>=1.1",
    "scipy>=1.14",
    "networkx>=3.3",
    "python-igraph>=0.11",
    "leidenalg>=0.10",
    "jsonschema>=4.23",
    "neo4j>=5.24",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: tests sur les données réelles (nécessitent d'avoir exécuté le pipeline)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
