name: graphe-medias

services:
  pipeline:
    build:
      context: .
      dockerfile: docker/pipeline.Dockerfile
    image: graphe-medias-pipeline:dev
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data                 # données brutes et intermédiaires : jamais dans l'image
      - ./site/public:/app/site/public   # sorties agrégées destinées au site
      - ./site/src/graph:/app/site/src/graph:ro   # schéma de graph.json (contrat avec le site)
      - ./docs/methode.md:/app/docs/methode.md:ro  # chiffres publiés, vérifiés par les tests
      # Code monté en développement : pas besoin de reconstruire l'image à chaque modification.
      - ./pipeline:/app/pipeline:ro
      - ./tests:/app/tests:ro
    environment:
      # Base graphe d'analyse (profil « analyse ») ; mot de passe dans .env (non versionné).
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
    command: ["python", "-m", "pipeline", "run"]

  # Serveur de développement Vite (rechargement à chaud) : http://localhost:5173
  site-dev:
    build:
      context: .
      dockerfile: docker/site.Dockerfile
      target: dev
    image: graphe-medias-site-dev:dev
    volumes:
      - ./site:/app/site
      - /app/site/node_modules           # dépendances de l'image, pas celles de l'hôte
      - ./docs/methode.md:/app/docs/methode.md:ro   # source de la page Méthode
    ports:
      - "127.0.0.1:5173:5173"

  # Site de production (nginx non privilégié) : http://localhost:8080
  site:
    build:
      context: .
      dockerfile: docker/site.Dockerfile
      target: runtime
    image: graphe-medias-site:dev
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      start_interval: 1s

  # Tests de bout en bout contre l'image de production (CdC technique § 12.2) : `make test-e2e`
  e2e:
    build:
      context: .
      dockerfile: docker/e2e.Dockerfile
    image: graphe-medias-e2e:dev
    profiles: ["test"]
    depends_on:
      site:
        condition: service_healthy
    environment:
      BASE_URL: http://site:8080
    ipc: host          # recommandé par Playwright pour Chromium

  # Base graphe d'analyse (ADR-002), hors du site : `make neo4j` puis http://localhost:7474
  neo4j:
    image: neo4j:5-community@sha256:c7d25c0eeebfe125718d58b72ed5d663c85d0479047733845eb2237c67ce8069
    profiles: ["analyse"]
    environment:
      # L'image transforme chaque variable NEO4J_* en réglage : seul NEO4J_AUTH est défini.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      start_interval: 2s
      retries: 10

volumes:
  neo4j-data:
