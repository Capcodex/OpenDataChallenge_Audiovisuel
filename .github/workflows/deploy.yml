name: Mise en production

# T-087 (CdC technique § 13, ADR-010) : une étiquette de version (v1.0.0…) posée sur un commit de
# main publie les images multi-architecture sur ghcr.io, puis déploie l'image `site` sur le service
# Cloud Run de production. Cloud Run ne lit pas ghcr.io : la même image (même empreinte) est
# copiée dans Artifact Registry avant le déploiement.
# Après le déploiement, scripts/verifier-production.sh contrôle le site en ligne ; en cas d'échec,
# le trafic revient à la révision précédente, notée avant le déploiement.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write        # ghcr.io
  id-token: write        # jeton OIDC pour Workload Identity Federation

concurrency:
  group: production
  cancel-in-progress: false

env:
  PROJET: ${{ vars.GCP_PROJECT_ID }}
  REGION: europe-west9                 # Paris
  SERVICE: graphe-medias
  VERSION: ${{ github.ref_name }}

jobs:
  images:
    name: Images multi-architecture (ghcr.io)
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.noms.outputs.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: L'étiquette est sur main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$VERSION n'est pas un commit de main"; exit 1; }

      - name: Noms des images
        id: noms
        run: |
          proprietaire=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          echo "site=ghcr.io/$proprietaire/graphe-medias-site" >> "$GITHUB_OUTPUT"
          echo "pipeline=ghcr.io/$proprietaire/graphe-medias-pipeline" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image du site (amd64, arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/site.Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.noms.outputs.site }}:${{ env.VERSION }}
            ${{ steps.noms.outputs.site }}:${{ github.sha }}
            ${{ steps.noms.outputs.site }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=site-multi
          cache-to: type=gha,mode=max,scope=site-multi

      - name: Image du pipeline (amd64, arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/pipeline.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.noms.outputs.pipeline }}:${{ env.VERSION }}
            ${{ steps.noms.outputs.pipeline }}:${{ github.sha }}
            ${{ steps.noms.outputs.pipeline }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=pipeline-multi
          cache-to: type=gha,mode=max,scope=pipeline-multi

  production:
    name: Déployer en production
    needs: images
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploiement.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Authentification Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copier l'image publiée dans Artifact Registry
        id: image
        env:
          SOURCE: ${{ needs.images.outputs.site }}:${{ env.VERSION }}
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          cible="$REGION-docker.pkg.dev/$PROJET/graphe-medias/site:$VERSION"
          docker buildx imagetools create --tag "$cible" "$SOURCE"
          empreinte=$(docker buildx imagetools inspect "$cible" --format '{{ json .Manifest.Digest }}' | tr -d '"')
          test "$empreinte" = "$(docker buildx imagetools inspect "$SOURCE" --format '{{ json .Manifest.Digest }}' | tr -d '"')"
          echo "image=$REGION-docker.pkg.dev/$PROJET/graphe-medias/site@$empreinte" >> "$GITHUB_OUTPUT"

      - name: Noter la révision en service (retour arrière)
        id: precedente
        run: |
          revision=$(gcloud run services describe "$SERVICE" --region="$REGION" --format=json \
            | jq -r '[.status.traffic[] | select(.percent == 100)][0].revisionName // empty')
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Révision en service avant $VERSION : ${revision:-aucune}"

      - name: Déployer la nouvelle révision
        id: deploiement
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          suffixe=$(echo "$VERSION" | tr 'A-Z.' 'a-z-')
          gcloud run deploy "$SERVICE" --image="$IMAGE" --region="$REGION" --port=8080 \
            --revision-suffix="$suffixe-${GITHUB_SHA::7}-$GITHUB_RUN_ATTEMPT" \
            --service-account="graphe-medias-site@$PROJET.iam.gserviceaccount.com" \
            --memory=256Mi --cpu=1 --min-instances=0 --max-instances=3 --quiet
          numero=$(gcloud projects describe "$PROJET" --format='value(projectNumber)')
          echo "url=https://$SERVICE-$numero.$REGION.run.app" >> "$GITHUB_OUTPUT"

      - name: Vérifier la production
        env:
          URL: ${{ steps.deploiement.outputs.url }}
        run: sh scripts/verifier-production.sh "$URL"

      - name: Retour arrière si la vérification échoue
        if: failure() && steps.precedente.outputs.revision != ''
        env:
          PRECEDENTE: ${{ steps.precedente.outputs.revision }}
        run: |
          gcloud run services update-traffic "$SERVICE" --region="$REGION" \
            --to-revisions="$PRECEDENTE=100" --quiet
          echo "::error::Vérification en échec : trafic rendu à $PRECEDENTE"

      - name: Résumé
        if: always()
        env:
          URL: ${{ steps.deploiement.outputs.url }}
          IMAGE: ${{ steps.image.outputs.image }}
          PRECEDENTE: ${{ steps.precedente.outputs.revision }}
        run: |
          {
            echo "## Production : $VERSION"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Adresse | $URL |"
            echo "| Image | \`$IMAGE\` |"
            echo "| Révision précédente | \`${PRECEDENTE:-aucune}\` |"
            echo
            echo "Retour arrière manuel :"
            echo '```'
            echo "gcloud run services update-traffic $SERVICE --region=$REGION --to-revisions=${PRECEDENTE:-<révision>}=100"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
